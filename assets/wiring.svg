<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Conceptual protected 1S solar wiring">
  <rect width="1000" height="440" fill="#f6f8fa"/>
  <g font-family="Segoe UI,Arial" fill="#102a43" font-size="22" text-anchor="middle">
    <rect x="55" y="150" width="175" height="100" rx="16" fill="#ffd166" stroke="#102a43" stroke-width="3"/><text x="142" y="192">1 W PV</text><text x="142" y="223" font-size="16">regulated input</text>
    <rect x="300" y="130" width="190" height="140" rx="16" fill="#b8e0d2" stroke="#102a43" stroke-width="3"/><text x="395" y="177">1S charger</text><text x="395" y="208" font-size="16">CC/CV + protection</text><text x="395" y="238" font-size="16">verified for PV</text>
    <rect x="560" y="130" width="165" height="140" rx="16" fill="#d9f0f5" stroke="#102a43" stroke-width="3"/><text x="642" y="177">1S2P pack</text><text x="642" y="208" font-size="16">matched cells</text><text x="642" y="238" font-size="16">BMS/protection</text>
    <rect x="795" y="130" width="150" height="140" rx="16" fill="#79c2d0" stroke="#102a43" stroke-width="3"/><text x="870" y="177">XIAO +</text><text x="870" y="208">SX1262</text><text x="870" y="238" font-size="16">repeater</text>
  </g>
  <g stroke="#147d92" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M230 185h70"/><path d="M490 185h70"/><path d="M725 185h70"/></g>
  <text x="500" y="350" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#8a1c1c">CONCEPT ONLY — do not parallel cells at different voltages; verify charger and protection first.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#147d92"/></marker></defs>
</svg>

